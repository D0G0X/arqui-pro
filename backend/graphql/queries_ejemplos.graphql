# ================================================================
# QUERIES COMBINADAS COMPLEJAS (Ejemplos avanzados)
# ================================================================

# ---------------------------------------------------------------
# Ejemplo: Perfil completo con proyectos y sus valoraciones
# ---------------------------------------------------------------

query PerfilArquitectoConProyectosDetallados {
  perfilCompletoArquitecto(arquitectoId: "1") {
    arquitecto {
      cedula
      especialidades
      ubicacion
      verificado
    }
    usuario {
      nombre
      apellido
      email
      foto_perfil
    }
    proyectos {
      id
      titulo_proyecto
      tipo_proyecto
      valoracion_promedio
      avances {
        descripcion
        fecha
      }
      valoraciones {
        calificacion
        comentario
        fecha
      }
    }
    total_proyectos
    valoracion_promedio
  }
}

# ---------------------------------------------------------------
# Ejemplo: Dashboard completo con estadísticas y KPIs
# ---------------------------------------------------------------

query DashboardCompleto {
  kpisPlataforma {
    total_usuarios
    total_proyectos
    total_arquitectos
    arquitectos_verificados
    usuarios_por_rol {
      rol
      cantidad
    }
  }
  buscarArquitectos(verificado: true, valoracionMinima: 4.5) {
    id
    usuario {
      nombre
    }
    valoracion_prom_proyecto
  }
}

# ---------------------------------------------------------------
# Ejemplo: Búsqueda multi-criterio con nested data
# ---------------------------------------------------------------

query BusquedaAvanzadaProyectos {
  buscarProyectos(
    tipoProyecto: "Residencial"
    valoracionMinima: 4.0
    fechaDesde: "2024-01-01"
  ) {
    id
    titulo_proyecto
    valoracion_promedio
    arquitecto {
      cedula
      especialidades
      usuario {
        nombre
        apellido
        email
      }
      proyectos {
        titulo_proyecto
      }
    }
    cliente {
      usuario {
        nombre
        apellido
      }
    }
    avances {
      descripcion
      fecha
    }
  }
}
