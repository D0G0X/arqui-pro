name: Backend CI/CD

on:
  push:
    branches: [ main, develop, merge ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

jobs:
  # ============================================
  # Rails API REST Tests
  # ============================================
  rails-test:
    name: Rails API - Test & Lint
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arquipro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: backend/APIREST
      
      - name: Install dependencies
        working-directory: backend/APIREST
        run: bundle install
      
      - name: Setup database
        working-directory: backend/APIREST
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arquipro_test
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load
      
      - name: Run RuboCop
        working-directory: backend/APIREST
        run: bundle exec rubocop
        continue-on-error: true
      
      - name: Run Brakeman security scan
        working-directory: backend/APIREST
        run: bundle exec brakeman --no-pager
        continue-on-error: true
      
      - name: Run tests
        working-directory: backend/APIREST
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arquipro_test
        run: bundle exec rails test
        continue-on-error: true

  # ============================================
  # GraphQL API Tests (Python)
  # ============================================
  graphql-test:
    name: GraphQL API - Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/graphql/requirements.txt
      
      - name: Install dependencies
        working-directory: backend/graphql
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint black flake8 pytest pytest-cov
      
      - name: Run Black formatter check
        working-directory: backend/graphql
        run: black --check .
        continue-on-error: true
      
      - name: Run Flake8
        working-directory: backend/graphql
        run: flake8 . --max-line-length=100 --exclude=__pycache__,venv
        continue-on-error: true
      
      - name: Run Pylint
        working-directory: backend/graphql
        run: pylint **/*.py --disable=C0111,R0903
        continue-on-error: true
      
      - name: Run tests
        working-directory: backend/graphql
        run: pytest --cov=. --cov-report=xml
        continue-on-error: true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./backend/graphql
          flags: graphql
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ============================================
  # WebSocket Server Tests (NestJS)
  # ============================================
  websocket-test:
    name: WebSocket - Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/wedsocket/package-lock.json
      
      - name: Install dependencies
        working-directory: backend/wedsocket
        run: npm ci
      
      - name: Run ESLint
        working-directory: backend/wedsocket
        run: npm run lint
        continue-on-error: true
      
      - name: Run tests
        working-directory: backend/wedsocket
        run: npm test -- --coverage
        continue-on-error: true
      
      - name: Build
        working-directory: backend/wedsocket
        run: npm run build

  # ============================================
  # Docker Build Test
  # ============================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [rails-test, graphql-test, websocket-test]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Rails Docker image
        working-directory: backend/APIREST
        run: |
          docker build -t arquipro-rails:test .
        continue-on-error: true
      
      - name: Test Rails container
        run: |
          docker run --rm arquipro-rails:test rails --version
        continue-on-error: true

  # ============================================
  # Security Scanning
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [rails-test, graphql-test, websocket-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ============================================
  # Integration Test
  # ============================================
  integration-test:
    name: Integration Test (All Services)
    runs-on: ubuntu-latest
    needs: [rails-test, graphql-test, websocket-test]
    if: github.event_name == 'pull_request'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arquipro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup services
        run: |
          echo "Starting integration tests..."
          # Add docker-compose or manual service startup here
        continue-on-error: true
      
      - name: Run integration tests
        run: |
          echo "Running integration tests across all services"
          # Add your integration test commands here
        continue-on-error: true

  # ============================================
  # Notification
  # ============================================
  notify-status:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [rails-test, graphql-test, websocket-test, security-scan]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "Rails Test: ${{ needs.rails-test.result }}"
          echo "GraphQL Test: ${{ needs.graphql-test.result }}"
          echo "WebSocket Test: ${{ needs.websocket-test.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
      
      - name: Send notification on failure
        if: failure()
        run: |
          echo "❌ Backend CI/CD Pipeline failed! Check the logs for details."
          # Add Slack/Discord webhook here if needed
        continue-on-error: true
